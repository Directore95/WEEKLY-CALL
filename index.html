<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Call Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Login Section -->
        <div id="login-section" class="container">
            <h1>Weekly Call Dashboard</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
                <p id="login-error" class="error-message"></p>
            </form>
        </div>

        <!-- Dashboard Section (hidden until login) -->
        <div id="dashboard-section" class="container hidden">
            <header>
                <h1>Weekly Call Dashboard</h1>
                <div class="user-info">
                    <span id="user-display"></span>
                    <button id="logout-btn" class="btn btn-secondary">Logout</button>
                </div>
            </header>

            <main>
                <section class="summary-cards">
                    <div class="card">
                        <h3>Total Participants</h3>
                        <p id="total-participants" class="stat">0</p>
                    </div>
                    <div class="card">
                        <h3>Upcoming Calls</h3>
                        <p id="upcoming-calls" class="stat">0</p>
                    </div>
                    <div class="card">
                        <h3>Completed This Month</h3>
                        <p id="completed-calls" class="stat">0</p>
                    </div>
                </section>

                <section class="calls-section">
                    <h2>Scheduled Calls</h2>
                    <table id="calls-table">
                        <thead>
                            <tr>
                                <th>Meeting</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Participants</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="calls-body">
                        </tbody>
                    </table>
                </section>

                <section class="participants-section">
                    <h2>Team Members</h2>
                    <div id="participants-list" class="participants-grid">
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="mockData.js"></script>
    <script src="app.js"></script>
</body>
</html>
